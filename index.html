<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Office Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="main-header">
    <div class="logo">
        <span class="icon">🏢</span>
        <h1>Office Dashboard</h1>
    </div>
    <!-- Кнопка-переключатель тем -->
    <button id="themeToggle" class="theme-btn" aria-label="Переключить тему">
        <span class="theme-icon">🌓</span>
        <span class="theme-text">Сменить тему</span>
    </button>
</header>

<div class="dashboard">

    <div class="card">
        <h2>Время</h2>
        <div id="clock">--:--:--</div>
    </div>

    <div class="card">
        <h2>Погода</h2>
        <div id="weather">Загрузка...</div>
    </div>

    <div class="card">
        <h2>USD/KGS</h2>
        <div id="currency">Загрузка...</div>
    </div>

    <div class="card">
        <h2>Новости</h2>
        <ul id="news"></ul>
    </div>

    <div class="card chart-card">
        <h2>Курс USD!!!!!!</h2>
        <canvas id="currencyChart"></canvas>
    </div>

</div>

<script type="module" src="app.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const themeToggleBtn = document.getElementById('themeToggle');

        // Проверяем, была ли сохранена тема ранее в браузере
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
        }

        // Обработчик клика по кнопке
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');

            // Сохраняем выбор пользователя, чтобы тема не слетала при перезагрузке
            if (document.body.classList.contains('dark-theme')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });
    });
</script>

</body>
</html>
